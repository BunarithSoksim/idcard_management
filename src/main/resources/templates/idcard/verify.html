<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Card Verification</title>
<style>
  body{font-family:Arial,sans-serif;background:#f9fafb;display:flex;justify-content:center;padding:60px;}
  .box{background:white;border-radius:10px;padding:30px;box-shadow:0 4px 16px rgba(0,0,0,.1);max-width:360px;width:100%;}
  h2{color:#16a34a;} p{color:#374151;} .label{font-size:11px;color:#9ca3af;}
</style>
</head>
<body><div class="box">
  <h2>✅ Verified</h2>
  <p th:text="${profile.fullName}" style="font-size:18px;font-weight:bold;"></p>
  <p><span class="label">Type:</span> <span th:text="${profile.type}"></span></p>
  <p><span class="label">ID:</span> <span th:text="${profile.registrationNumber}"></span></p>
  <p><span class="label">Department:</span> <span th:text="${profile.department}"></span></p>
  <p><span class="label">Valid Until:</span> <span th:text="${profile.expiryDate}"></span></p>
</div></body>
</html>
